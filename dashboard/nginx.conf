# Apex-to-www redirect removed: it named openshorts.app, a domain this fork
# doesn't own. If you deploy this behind your own domain and want the same
# apex->www consolidation (see git history for the original rationale: Coolify
# regenerates Traefik labels on every deploy and hardcodes a temporary 307,
# so a permanent redirect needs to live here instead), add your own
# `server { listen 80; server_name your.apex; return 301 https://www.your.domain$request_uri; }`
# block here.

server {
    # Explicitly the default server: the block above claims a specific
    # server_name, and without this marker nginx would fall back to whichever
    # block is declared first.
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed assets aggressively; never cache index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The public gallery and per-video pages are server-rendered by the
    # backend (app.py's /gallery and /video/{id} routes), not this static
    # frontend, so if you deploy frontend and backend on separate domains,
    # redirect these two paths to your backend's domain here — otherwise
    # they silently serve the landing page instead:
    # location /gallery { return 301 https://your-api-domain$request_uri; }
    # location /video/  { return 301 https://your-api-domain$request_uri; }

    # index.html must NOT be cached — it points at the hashed asset bundle, so a
    # stale cached copy keeps loading the previous deploy's JS. (nginx add_header
    # doesn't inherit into a location that sets its own, so the security headers
    # are repeated here.)
    #
    # Unknown paths get a real 404, not the SPA shell. The app routes entirely
    # through the hash (#app, #legal), which never reaches the server, so
    # there is no deep link that needs the fallback.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
