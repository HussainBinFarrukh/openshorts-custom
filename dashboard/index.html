<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo-openshorts.png" />
  <!-- viewport-fit=cover so the bottom tab bar can pad itself past the iOS home
       indicator with env(safe-area-inset-bottom); without it that inset reads 0. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="color-scheme" content="dark" />

  <!-- Fonts: Lumen system (Instrument Serif display · Geist body · JetBrains Mono labels).
       Served from this origin, not fonts.googleapis.com: a Google-hosted
       stylesheet sends every visitor's IP address to a US processor before the
       page has rendered and before anyone consented to anything. See
       public/fonts.css for how the subsets were generated. -->
  <link rel="stylesheet" href="/fonts.css" />

  <!-- Primary SEO Meta Tags -->
  <title>ClipLinQ - Open Source AI Clip Generator (MIT)</title>
  <meta name="description" content="Open source AI clip generator: turn long videos into 9:16 shorts for TikTok, Reels and Shorts. Self-hosted, free under MIT, no watermark, no cap." />
  <meta name="author" content="ClipLinQ" />
  <meta name="robots" content="index, follow" />

  <!-- JSON-LD Structured Data: the MIT self-hosted project only — no hosted
       service, no pricing tiers, no competitor claims. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "ClipLinQ",
      "description": "Open source AI clip generator, MIT licensed and self-hosted with Docker. Turns long-form videos into viral-ready 9:16 clips for TikTok, Instagram Reels and YouTube Shorts using Google Gemini for moment detection, faster-whisper for word-level subtitles and MediaPipe for face-tracked reframing. Free, no watermark, no usage cap; you supply your own API keys.",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Cross-platform (Docker)",
      "downloadUrl": "https://github.com/HussainBinFarrukh/openshorts-custom",
      "codeRepository": "https://github.com/HussainBinFarrukh/openshorts-custom",
      "license": "https://opensource.org/licenses/MIT",
      "isAccessibleForFree": true,
      "featureList": [
        "AI viral moment detection with Google Gemini",
        "Smart 9:16 vertical cropping with MediaPipe face tracking and YOLOv8 fallback",
        "Automatic subtitle generation with word-level timestamps",
        "AI voice dubbing in 30+ languages via ElevenLabs",
        "Local video file upload and YouTube link ingest",
        "Hook text overlays with styled fonts",
        "AI-generated video effects via FFmpeg",
        "Direct posting to TikTok, Instagram Reels and YouTube Shorts",
        "AI YouTube thumbnail, title and description generator",
        "AI UGC video creator with AI actors and lip-sync",
        "Self-hosted Docker Compose deployment"
      ],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock",
        "description": "Free and open source under MIT, no watermark, no usage cap. Requires Docker and your own API keys."
      }
    }
    </script>

  <!-- Analytics — opt-in, disabled by default, and never loaded before consent.
       A plain `npm run build` (and every local `npm run dev`) leaves the two
       VITE_OPENPANEL_* variables unset, so nothing is initialised, no script is
       fetched and no request leaves the browser. Self-hosted instances are
       silent unless you deliberately turn this on.

       Nothing here RUNS on page load any more: it only publishes
       window.__osAnalyticsInit, and the React consent manager
       (src/lib/consent.js) calls it once the visitor has actually accepted the
       analytics category. Loading a tracker in the static <head> and asking
       afterwards is the exact pattern LSSI art. 22.2 forbids.

       op1.js is served from this origin (public/op1.js), not from
       openpanel.dev: a third-party script sees the visitor's IP and can be
       changed under us at any time.

       To collect analytics for your own deployment: point
       VITE_OPENPANEL_API_URL / VITE_OPENPANEL_CLIENT_ID at your own OpenPanel
       instance (see .env.example) and add your hostname to ANALYTICS_HOSTS. -->
    <script>
      window.op = window.op || function () { var n = []; return new Proxy(function () { arguments.length && n.push([].slice.call(arguments)); }, { get: function (t, r) { return "q" === r ? n : function () { n.push([r].concat([].slice.call(arguments))); }; }, has: function (t, r) { return "q" === r; } }); }();
      window.__osAnalyticsInit = (function () {
        var started = false;
        return function () {
          if (started) return false;
          // Vite substitutes these at build time and leaves the placeholder literal
          // in place when the variable is undefined.
          var apiUrl = "%VITE_OPENPANEL_API_URL%";
          var clientId = "%VITE_OPENPANEL_CLIENT_ID%";
          var unset = function (v) { return !v || v.charAt(0) === "%"; };
          if (unset(apiUrl) || unset(clientId)) return false;

          // Second gate: hosts allowed to report. A dist/ built with credentials
          // stays inert anywhere else (a fork, a mirror, a preview domain), so a
          // deployment can never report into somebody else's dashboard.
          var ANALYTICS_HOSTS = /^$/; // no deployment host configured yet
          if (!ANALYTICS_HOSTS.test(location.hostname)) return false;

          started = true;
          window.op("init", {
            apiUrl: apiUrl,
            clientId: clientId,
            trackScreenViews: true,
            trackOutgoingLinks: true,
            trackAttributes: true,
          });

          var s = document.createElement("script");
          s.src = "/op1.js";
          s.defer = true;
          s.async = true;
          document.head.appendChild(s);
          return true;
        };
      })();
    </script>
  </head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
