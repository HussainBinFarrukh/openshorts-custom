[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cliplinq"
version = "0.1.0"
description = "CLI for ClipLinQ: clip long videos into vertical shorts and publish them, from the terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ClipLinQ" }]
keywords = ["video", "clips", "shorts", "ai", "tiktok", "youtube-shorts", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Source = "https://github.com/HussainBinFarrukh/openshorts-custom"

[project.scripts]
cliplinq = "cliplinq_cli:main"

[tool.setuptools]
py-modules = ["cliplinq_cli"]
